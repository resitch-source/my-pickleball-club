<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubHub — Multi-Sport Club Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
:root {
  --brand: #1a3a2a;
  --brand-mid: #2d6a4f;
  --accent: #52b788;
  --accent-light: #b7e4c7;
  --gold: #d4a843;
  --surface: #f8f7f3;
  --text: #1a1a18;
  --muted: #6b6b63;
  --border: rgba(26,58,42,0.12);
  --card-bg: #ffffff;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --brand: #52b788;
  --brand-mid: #74c69d;
  --accent: #74c69d;
  --accent-light: #1b4332;
  --surface: #0d1b14;
  --text: #e8f5e9;
  --muted: #a8c5b0;
  --border: rgba(82,183,136,0.15);
  --card-bg: #132218;
  --shadow: 0 2px 16px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: linear-gradient(160deg, var(--brand) 0%, #0d2b1a 100%);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(82,183,136,0.15) 0%, transparent 70%);
  top: -200px; right: -200px;
}
.hero::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,67,0.1) 0%, transparent 70%);
  bottom: -150px; left: -100px;
}
.logo-wrap { text-align: center; margin-bottom: 3rem; z-index: 1; }
.logo-icon {
  width: 72px; height: 72px;
  background: var(--accent);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
  font-size: 2rem;
}
.logo-text {
  font-family: 'DM Serif Display', serif;
  font-size: 2.8rem;
  color: #ffffff;
  letter-spacing: -0.02em;
}
.logo-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 0.3rem;
}
.login-card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 2.5rem;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.3);
  z-index: 1;
}
.login-card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem;
  color: var(--brand);
  margin-bottom: 0.4rem;
}
.login-card p {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 2rem;
}
.form-group { margin-bottom: 1.2rem; }
.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.form-group input {
  width: 100%;
  padding: 0.85rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--text);
  background: var(--surface);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
}
.role-tabs {
  display: flex;
  background: var(--surface);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 1.5rem;
  gap: 4px;
}
.role-tab {
  flex: 1;
  padding: 0.6rem;
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: all 0.2s;
}
.role-tab.active {
  background: var(--card-bg);
  color: var(--brand);
  box-shadow: 0 1px 6px rgba(0,0,0,0.1);
}
.btn-primary {
  width: 100%;
  padding: 0.9rem;
  background: var(--brand-mid);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}
.btn-primary:hover { background: var(--brand); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
.btn-primary:active { transform: translateY(0); }
.login-meta {
  margin-top: 1.2rem;
  text-align: center;
  font-size: 0.82rem;
  color: var(--muted);
}
.login-meta a { color: var(--brand-mid); text-decoration: none; font-weight: 500; }
.demo-note {
  background: rgba(82,183,136,0.1);
  border: 1px solid rgba(82,183,136,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.8rem;
  color: var(--brand-mid);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.error-msg {
  background: rgba(220,53,69,0.08);
  border: 1px solid rgba(220,53,69,0.2);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  font-size: 0.85rem;
  color: #c0392b;
  margin-bottom: 1rem;
  display: none;
}
.loading-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 999;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 1rem;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: white; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="hero">
  <div class="logo-wrap">
    <div class="logo-icon">🏟️</div>
    <div class="logo-text">ClubHub</div>
    <div class="logo-sub">Multi-Sport Club Platform</div>
  </div>

  <div class="login-card">
    <h2>Welcome back</h2>
    <p>Sign in to your account to continue</p>

    <div class="demo-note">
      <strong>Demo Mode:</strong> Admin → admin@club.com / admin123 &nbsp;|&nbsp; Member → member@club.com / member123
    </div>

    <div class="role-tabs">
      <button class="role-tab active" onclick="setRole('admin')">⚙️ Admin Panel</button>
      <button class="role-tab" onclick="setRole('member')">👤 Member Portal</button>
      <button class="role-tab" onclick="setRole('kiosk')">🖥️ Kiosk</button>
    </div>

    <div class="error-msg" id="error-msg">Invalid credentials. Please try again.</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" value="admin@club.com">
    </div>
    <div class="form-group" id="password-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" value="admin123" onkeydown="if(event.key==='Enter')login()">
    </div>

    <button class="btn-primary" onclick="login()">Sign In</button>

    <div class="login-meta">
      <a href="#" onclick="forgotPass()">Forgot password?</a> &nbsp;·&nbsp;
      <a href="pages/register.html">Create account</a>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Signing you in…</div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
let currentRole = 'admin';

function setRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach((t,i) => {
    t.classList.toggle('active', ['admin','member','kiosk'][i] === role);
  });
  const pwGroup = document.getElementById('password-group');
  if (role === 'kiosk') {
    document.getElementById('email').value = 'kiosk@club.com';
    document.getElementById('password').value = 'kiosk123';
  } else if (role === 'admin') {
    document.getElementById('email').value = 'admin@club.com';
    document.getElementById('password').value = 'admin123';
  } else {
    document.getElementById('email').value = 'member@club.com';
    document.getElementById('password').value = 'member123';
  }
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errMsg = document.getElementById('error-msg');
  errMsg.style.display = 'none';

  if (!email || !password) {
    errMsg.textContent = 'Please enter email and password.';
    errMsg.style.display = 'block';
    return;
  }

  document.getElementById('loading').classList.add('show');

  try {
    const result = await API.login(email, password);
    if (result.success) {
      sessionStorage.setItem('clubhub_user', JSON.stringify(result.user));
      const role = result.user.role;
      if (role === 'admin' || role === 'staff') {
        window.location.href = 'pages/admin.html';
      } else if (role === 'kiosk') {
        window.location.href = 'pages/kiosk.html';
      } else {
        window.location.href = 'pages/member.html';
      }
    } else {
      errMsg.textContent = result.message || 'Invalid credentials.';
      errMsg.style.display = 'block';
    }
  } catch(e) {
    // Demo fallback when no Apps Script connected
    const demos = {
      'admin@club.com': { role:'admin', name:'Admin User', email:'admin@club.com', id:'U001' },
      'member@club.com': { role:'member', name:'Alex Rivera', email:'member@club.com', id:'U002', membership:'Premium' },
      'kiosk@club.com': { role:'kiosk', name:'Kiosk', email:'kiosk@club.com', id:'K001' }
    };
    const user = demos[email];
    if (user && password.length >= 6) {
      sessionStorage.setItem('clubhub_user', JSON.stringify(user));
      const role = user.role;
      if (role === 'admin') window.location.href = 'pages/admin.html';
      else if (role === 'kiosk') window.location.href = 'pages/kiosk.html';
      else window.location.href = 'pages/member.html';
    } else {
      errMsg.textContent = 'Invalid credentials. Try the demo accounts shown above.';
      errMsg.style.display = 'block';
    }
  } finally {
    document.getElementById('loading').classList.remove('show');
  }
}

function forgotPass() {
  alert('Password reset link would be sent to your email. (Configure SMTP in Apps Script)');
}
</script>
</body>
</html>
